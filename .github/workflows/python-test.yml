name: "Python Tests"

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  pytest:
    name: "pytest (py${{ matrix.python-version }} ${{ matrix.extras || 'no extras' }})"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest]
        extras: ["", "--extra polars"]  # once without and once with the optional polars extra
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: uv sync --locked --group tests ${{ matrix.extras }}
      - name: Run the Unit Tests
        run: uv run --locked ${{ matrix.extras }} pytest unittests
