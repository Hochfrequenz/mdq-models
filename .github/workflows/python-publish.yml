name: "Publish to PyPI"

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: uv sync --locked --group tests --group linting --group coverage --group type_check
      - name: Run tests
        run: uv run --locked pytest unittests
      - name: Run tests with the polars extra
        run: uv run --locked --extra polars pytest unittests
      - name: Run linting
        run: |
          uv run --locked ruff check src/mdq_models unittests
      - name: Run type_check
        run: |
          uv run --locked mypy --show-error-codes src/mdq_models --strict
          uv run --locked mypy --show-error-codes unittests --strict
      - name: Run coverage
        run: |
          uv run --locked coverage run -m pytest unittests
          uv run --locked coverage report --fail-under 80 --omit 'unittests/*,.venv/*'

  build-n-publish:
    name: Build and publish Python distributions to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read # job-level permissions replace the workflow-level ones; checkout needs this
      id-token: write
    needs: tests
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs derives the package version from the git tag
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.15"
      - name: Build wheel and source distributions
        run: uv build
      - name: Publish distribution to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
