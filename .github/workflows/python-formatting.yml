name: "Python Formatting"

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  format:
    name: "format (${{ matrix.tool }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tool: ruff-format
            command: "ruff format --check ."
          - tool: ruff-isort
            command: "ruff check --select I ."
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: uv sync --locked --group linting
      - name: ${{ matrix.tool }}
        run: uv run --locked ${{ matrix.command }}
