name: "Python Lint"

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  pylint:
    name: "Python Code Quality and Lint (${{ matrix.linter-env }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - linter-env: linting
            commands: |
              uv run --locked ruff check src/mdq_models unittests
          - linter-env: type_check
            extras: "--extra polars"  # mypy needs polars to check mdq_models.polars
            commands: |
              uv run --locked --extra polars mypy --show-error-codes src/mdq_models --strict
              uv run --locked --extra polars mypy --show-error-codes unittests --strict
          - linter-env: spell_check
            commands: |
              uv run --locked codespell --ignore-words=domain-specific-terms.txt src
              uv run --locked codespell --ignore-words=domain-specific-terms.txt unittests README.md doc.go
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.15"
      - name: Install Dependencies
        run: uv sync --locked --group ${{ matrix.linter-env }} ${{ matrix.extras }}
      - name: Run ${{ matrix.linter-env }}
        run: ${{ matrix.commands }}
