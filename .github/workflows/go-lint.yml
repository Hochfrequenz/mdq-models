name: "Go Lint"

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  golangci:
    runs-on: ubuntu-latest
    name: lint
    env:
      # The linter runs on Go 1.27.x, the version named in go.mod.
      GOTOOLCHAIN: go1.27.0
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - uses: actions/checkout@v7
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --enable dupl,gocyclo
      - name: fmt
        run: golangci-lint fmt --diff --enable gofmt
