version: "2"
linters:
  default: standard
  enable:
    - revive
  settings:
    revive:
      enable-default-rules: false
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
        - name: package-comments
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - revive
